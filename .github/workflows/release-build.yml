name: "Auto compile Argon (IPK + APK)"

on:
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  check_version:
    name: Check Version
    runs-on: ubuntu-24.04
    outputs:
      argon_version: ${{ steps.check.outputs.latest_version }}
      has_update: ${{ steps.check.outputs.has_update }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: openwrt-25.12

      - name: Check version
        id: check
        run: |
          latest_version=$(grep -oP 'PKG_VERSION:=\K.*' Makefile | sed 's/^/v/')
          latest_release=$(wget -qO- https://api.github.com/repos/${{ github.repository }}/releases/latest | awk -F '"' '/tag_name/{print $4}')

          has_update=$([ "$latest_version" != "$latest_release" ] && echo true || echo false)

          echo "latest_version=$latest_version" >> $GITHUB_OUTPUT
          echo "has_update=$has_update" >> $GITHUB_OUTPUT

          echo "latest_version: $latest_version"
          echo "latest_release: $latest_release"
          echo "has_update: $has_update"

  build_argon:
    name: Build Argon ${{ matrix.tag }} (${{ matrix.type }})
    needs: check_version
    if: needs.check_version.outputs.has_update == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: 24.10.6
            type: ipk
            sdk_dir: sdk-ipk-24.10.6

          - tag: 25.12.1
            type: apk
            sdk_dir: sdk-apk-25.12.1

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            zstd build-essential clang flex bison g++ gawk git wget file unzip

      - name: Setup SDK
        run: |
          mkdir -p ${{ matrix.sdk_dir }}
          cd ${{ matrix.sdk_dir }}

          if [ "${{ matrix.type }}" = "ipk" ]; then
            echo ">>> IPK MODE"

            wget https://archive.openwrt.org/releases/24.10.6/targets/x86/64/openwrt-sdk-24.10.6-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            tar --zstd -xvf *.tar.zst --strip-components=1

          else
            echo ">>> APK MODE"

            wget https://archive.openwrt.org/releases/25.12.1/targets/x86/64/openwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            tar --zstd -xvf *.tar.zst --strip-components=1
          fi

      - name: Clone package
        run: |
          cd ${{ matrix.sdk_dir }}

          echo "src-git base https://github.com/openwrt/openwrt.git;main" > feeds.conf
          echo "src-git-full packages https://github.com/openwrt/packages.git;master" >> feeds.conf
          echo "src-git-full luci https://github.com/openwrt/luci.git;master" >> feeds.conf
          echo "src-git-full routing https://git.openwrt.org/feed/routing.git;master"  >> feeds.conf

          git clone -b openwrt-25.12 https://github.com/${{ github.repository }}.git package/luci-theme-argon

      - name: Build IPK
        if: matrix.type == 'ipk'
        run: |
          cd ${{ matrix.sdk_dir }}

          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-adguardhome luci-base

          echo "CONFIG_PACKAGE_luci-app-adguardhome=m" > .config
          echo "CONFIG_PACKAGE_luci-base=m" >> .config

          make defconfig

          make package/luci-app-adguardhome/compile -j$(nproc)

          mkdir -p ../output/ipk/${{ matrix.tag }}
          cp bin/packages/x86_64/base/*.ipk ../output/ipk/${{ matrix.tag }}/

      - name: Build APK
        if: matrix.type == 'apk'
        run: |
          cd ${{ matrix.sdk_dir }}

          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-adguardhome luci-base

          echo "CONFIG_PACKAGE_luci-app-adguardhome=m" > .config
          echo "CONFIG_PACKAGE_luci-base=m" >> .config

          make defconfig

          make package/luci-app-adguardhome/compile -j$(nproc)

          mkdir -p ../output/apk/${{ matrix.tag }}
          cp bin/packages/x86_64/base/*.apk ../output/apk/${{ matrix.tag }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: argon-${{ matrix.tag }}-${{ matrix.type }}
          path: output

  release:
    name: Create Release
    needs: [check_version, build_argon]
    if: needs.check_version.outputs.has_update == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@main
        with:
          path: output

      - name: Create Release
        uses: softprops/action-gh-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check_version.outputs.argon_version }}
          name: "LuCI Argon Auto Build"
          files: output/**/*
